[project]
name = "retail-demand-inventory-decision-engine"
version = "0.1.0"
description = "Demand forecasting, inventory policy simulation, and replenishment decisions for retail. Scaffold only; implementation not started."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Interactive demo (scripts/demo_*.py). Kept as an optional extra so the
# offline analysis pipeline stays dependency-light.
demo = [
    "streamlit>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_demand_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
